name: BlackoutBuyer
options:
  bundleIdPrefix: app.blackoutcheckout
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BlackoutBuyer:
    type: application
    platform: iOS
    sources:
      - path: BlackoutBuyer
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blackoutcheckout.buyer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BlackoutBuyer/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan merchant invoice QR codes.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the Blackout Checkout matcher running on your Mac.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
